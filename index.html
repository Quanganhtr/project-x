<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Screen</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: grid;
      place-items: center;
      background: #1a1a1a;
      font-family: system-ui, sans-serif;
    }
    .screen {
      width: 375px;
      height: 812px;
      max-width: 100vw;
      max-height: 100vh;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }
  </style>
</head>
<body>
  <main class="screen" aria-label="Demo screen 375x812"></main>
</body>
</html>
